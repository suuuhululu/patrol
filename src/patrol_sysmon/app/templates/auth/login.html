{% extends 'base.html' %}
{% block title %}로그인 · 시스템 모니터{% endblock %}
{% block content %}
<p class="step">관제 시스템 접속</p>
<h1>로그인</h1>
<p class="note">발급받은 계정으로 로그인하세요.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<!-- [로그인 입력] 실패 응답에도 비밀번호를 다시 표시하지 않는다. -->
<form method="post" class="fields">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">아이디</label>
    <input id="username" name="username" autocomplete="username" maxlength="32" required value="{{ username }}">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button type="submit">로그인</button>
</form>
{% if setup_needed %}
<aside class="note setup">초기 관리자 계정이 아직 없습니다. 서버 담당자가 초기 계정을 생성한 뒤 로그인할 수 있습니다.</aside>
{% endif %}
{% endblock %}
