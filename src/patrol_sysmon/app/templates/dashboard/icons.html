{# [공통 아이콘] 외부 라이브러리 없이 사용하는 장식용 SVG. 텍스트가 접근 가능한 이름을 제공한다. #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'robot' %}<rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 7V3m-2 0h4M1 12v4m22-4v4M9 16h6"/><circle cx="8.5" cy="11.5" r=".8"/><circle cx="15.5" cy="11.5" r=".8"/>
{% elif name == 'map' %}<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Zm6-3v15m6-12v15"/>
{% elif name == 'camera' %}<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>
{% elif name == 'log' %}<path d="M7 3h10l3 3v15H4V3Zm1 6h8m-8 4h8m-8 4h5"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m0-16a3 3 0 0 1 0 6m3 4a5 5 0 0 1 3 4v2"/>
{% elif name == 'shield' %}<path d="m12 2 8 3v6c0 5-8 11-8 11S4 16 4 11V5Z"/><path d="m8 11 3 3 5-6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'pin' %}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>
{% elif name == 'link' %}<path d="m10 8 3-3a4 4 0 0 1 6 6l-3 3M8 10l-3 3a4 4 0 0 0 6 6l3-3m-5-1 6-6"/>
{% elif name == 'exit' %}<path d="M10 4H4v16h6m3-12 4 4-4 4m-5-4h13"/>
{% elif name == 'layers' %}<path d="m12 3 10 5-10 5L2 8Zm-9 10 9 5 9-5m-18 5 9 5 9-5"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>
{% endif %}
</svg>
{%- endmacro %}
