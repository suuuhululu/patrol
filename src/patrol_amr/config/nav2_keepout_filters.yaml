# Overlay for TurtleBot4 Nav2.  The launch file replaces
# <robot_namespace> with /robot1 or /robot6 before applying this file.
#
# The red/base layer is a permanent map constraint.  Control may switch only
# center_corridor_keepout_filter.enabled as one logical transaction across the
# global and local costmaps.
/**/global_costmap:
  ros__parameters:
    filters:
      - base_keepout_filter
      - center_corridor_keepout_filter
    base_keepout_filter:
      plugin: "nav2_costmap_2d::KeepoutFilter"
      enabled: true
      filter_info_topic: "<robot_namespace>/keepout/base/filter_info"
    center_corridor_keepout_filter:
      plugin: "nav2_costmap_2d::KeepoutFilter"
      enabled: false
      filter_info_topic: "<robot_namespace>/keepout/center_corridor/filter_info"

/**/local_costmap:
  ros__parameters:
    filters:
      - base_keepout_filter
      - center_corridor_keepout_filter
    base_keepout_filter:
      plugin: "nav2_costmap_2d::KeepoutFilter"
      enabled: true
      filter_info_topic: "<robot_namespace>/keepout/base/filter_info"
    center_corridor_keepout_filter:
      plugin: "nav2_costmap_2d::KeepoutFilter"
      enabled: false
      filter_info_topic: "<robot_namespace>/keepout/center_corridor/filter_info"
